<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Consegne WatchSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
  </head>
  <body class="text-slate-800 pb-24">
    <!-- Sidebar Overlay -->
    <div
      id="sidebarOverlay"
      onclick="chiudiMenu()"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"
    ></div>

    <!-- Sidebar Menu -->
    <div
      id="sidebar"
      class="fixed top-0 left-0 w-72 h-full bg-white z-50 transform -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col"
    >
      <div
        class="bg-blue-600 text-white p-5 flex justify-between items-center shadow-md"
      >
        <h2 class="text-xl font-extrabold tracking-tight">Impostazioni</h2>
        <button
          onclick="chiudiMenu()"
          class="text-blue-100 hover:text-white p-1 rounded-lg transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
      <div class="p-6 flex-grow flex flex-col space-y-8">
        <div>
          <label
            class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider"
            >Zona di Lavoro</label
          >
          <select
            id="zona"
            onchange="cambioZona()"
            class="w-full bg-slate-100 border-2 border-slate-200 rounded-xl p-4 font-bold text-lg text-slate-800 focus:border-blue-500 focus:ring-0 appearance-none"
          >
            <option value="Zona A">Zona A</option>
            <option value="Zona B">Zona B</option>
          </select>
        </div>

        <div class="mt-auto border-t border-slate-100 pt-6">
          <button
            onclick="pulisciLista()"
            class="w-full bg-red-50 hover:bg-red-100 active:bg-red-200 text-red-600 font-bold text-lg p-4 rounded-xl transition-transform transform active:scale-95 flex justify-center items-center gap-2 border border-red-200"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
              />
            </svg>
            Nuovo Giorno
          </button>
          <p class="text-center text-slate-400 text-xs mt-3 font-medium">
            Azzera la lista e ricomincia
          </p>
        </div>
      </div>
    </div>

    <!-- App Header -->
    <header
      class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex items-center gap-4"
    >
      <button
        onclick="apriMenu()"
        class="p-2 -ml-2 bg-blue-700 hover:bg-blue-800 rounded-xl shadow-inner transition active:scale-95"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-7 w-7"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight">ConsegneApp</h1>
        <p
          id="header-zona-text"
          class="text-xs text-blue-200 font-medium tracking-wide"
        >
          Zona A
        </p>
      </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-md mx-auto space-y-6">
      <!-- Input Card -->
      <div
        class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4"
      >
        <div>
          <label
            class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider"
            >Seleziona Strada</label
          >
          <select
            id="strada"
            class="w-full bg-slate-100 border-none rounded-xl p-4 font-bold text-lg text-slate-700 focus:ring-2 focus:ring-blue-500 appearance-none"
          >
            <!-- Popolato da JS in ordine alfabetico -->
          </select>
        </div>

        <div class="flex space-x-3">
          <div class="w-2/3">
            <label
              class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider"
              >Civico</label
            >
            <input
              type="text"
              id="civico"
              placeholder="Es. 3E"
              class="w-full bg-slate-100 border-none rounded-xl p-4 font-bold text-xl text-slate-800 placeholder-slate-400 uppercase focus:ring-2 focus:ring-blue-500"
              autocomplete="off"
            />
          </div>
          <div class="w-1/3">
            <label
              class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider"
              >Pezzi</label
            >
            <input
              type="number"
              id="pezzi"
              value="1"
              min="1"
              class="w-full bg-slate-100 border-none rounded-xl p-4 font-bold text-xl text-slate-800 focus:ring-2 focus:ring-blue-500 text-center"
            />
          </div>
        </div>

        <button
          onclick="aggiungiPacco()"
          class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-xl p-4 rounded-xl shadow-lg transition-transform transform active:scale-95 flex justify-center items-center gap-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
          Aggiungi al Giro
        </button>
      </div>

      <!-- List Card -->
      <div>
        <h2
          class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3 px-2 flex justify-between items-end"
        >
          <span>Riepilogo Giro Ordinato</span>
          <span
            id="contatore-totale"
            class="bg-blue-100 text-blue-800 text-xs py-1 px-2 rounded-lg"
            >0 pacchi totali</span
          >
        </h2>
        <div id="lista-consegne" class="space-y-2">
          <div class="text-center text-slate-400 py-8 text-sm italic">
            Nessun pacco inserito.<br />Inizia ad aggiungere civici!
          </div>
        </div>
      </div>
    </main>

    <!-- Fixed Bottom Action Button -->
    <div
      class="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-white via-white to-transparent pb-6 z-20"
    >
      <button
        onclick="generaImmagineWatch()"
        class="w-full max-w-md mx-auto block bg-slate-900 hover:bg-black active:bg-slate-800 text-white font-bold text-lg p-4 rounded-2xl shadow-xl transition-transform transform active:scale-95 flex justify-center items-center gap-2 border-2 border-slate-700"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6 text-green-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"
          />
        </svg>
        Genera Foto Apple Watch
      </button>
    </div>

    <!-- Modals -->
    <div
      id="alertModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300"
    >
      <div
        class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-300"
        id="alertBox"
      >
        <h3 class="text-center text-xl font-bold text-slate-800 mb-2">
          Attenzione
        </h3>
        <p
          id="alertMessage"
          class="text-center text-slate-600 mb-6 font-medium"
        >
          Messaggio d'errore qui.
        </p>
        <button
          onclick="chiudiAlert()"
          class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl"
        >
          Ho capito
        </button>
      </div>
    </div>

    <div
      id="watchModal"
      class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300"
    >
      <div class="text-center text-white mb-4 max-w-xs">
        <h3 class="text-2xl font-bold mb-1 text-green-400">
          Pronto per il Watch!
        </h3>
        <p class="text-sm text-slate-300 font-medium leading-tight">
          Tieni premuto a lungo sull'immagine qui sotto e seleziona
          <strong>"Salva in Foto"</strong>.
        </p>
      </div>
      <div
        class="relative rounded-[32px] p-2 bg-slate-800 shadow-[0_0_30px_rgba(74,222,128,0.2)] border border-slate-700 flex justify-center overflow-hidden"
      >
        <img
          id="watchResultImg"
          src=""
          alt="Schermata Watch"
          class="rounded-[24px] w-[200px] max-h-[55vh] object-contain block"
        />
      </div>
      <button
        onclick="chiudiWatchModal()"
        class="mt-8 bg-white/10 hover:bg-white/20 text-white border border-white/30 font-bold py-3 px-8 rounded-full backdrop-blur-sm transition"
      >
        Chiudi Schermata
      </button>
    </div>

      // Strutture per la ricerca veloce e l'ordinamento
      const routeFlat = { "Zona A": [], "Zona B": [] };
      const routeMaxIndex = { "Zona A": {}, "Zona B": {} };

      function inizializzaMotoreRicerca() {
        for (let zona in masterRoute) {
          let indexCounter = 0;
          masterRoute[zona].forEach((blocco) => {
            let stradaUpper = blocco.street.toUpperCase();
            blocco.civici.forEach((civ) => {
              let civicoUpper = String(civ).toUpperCase();
              routeFlat[zona].push({
                strada: stradaUpper,
                civico: civicoUpper,
                ordineId: indexCounter,
              });
              routeMaxIndex[zona][stradaUpper] = indexCounter;
              indexCounter += 10; // Spazio per inserimenti di emergenza
            });
          });
        }
      }

      let consegne = [];

      window.onload = () => {
        inizializzaMotoreRicerca();
        caricaDatiLocali();
        const zonaSalvata = localStorage.getItem("zonaSelezionata") || "Zona A";
        document.getElementById("zona").value = zonaSalvata;
        document.getElementById("header-zona-text").innerText = zonaSalvata;
        aggiornaStrade();
        renderLista();
      };

      function apriMenu() {
        document.getElementById("sidebarOverlay").classList.remove("hidden");
        setTimeout(
          () =>
            document
              .getElementById("sidebarOverlay")
              .classList.remove("opacity-0"),
          10,
        );
        document
          .getElementById("sidebar")
          .classList.remove("-translate-x-full");
      }

      function chiudiMenu() {
        document.getElementById("sidebar").classList.add("-translate-x-full");
        document.getElementById("sidebarOverlay").classList.add("opacity-0");
        setTimeout(
          () =>
            document.getElementById("sidebarOverlay").classList.add("hidden"),
          300,
        );
      }

      function cambioZona() {
        const zonaSelezionata = document.getElementById("zona").value;
        localStorage.setItem("zonaSelezionata", zonaSelezionata);
        document.getElementById("header-zona-text").innerText = zonaSelezionata;
        aggiornaStrade();
        renderLista(); // AGGIUNTO: Aggiorna la vista quando cambi zona
        chiudiMenu();
      }

      function aggiornaStrade() {
        const zona = document.getElementById("zona").value;
        const selectStrada = document.getElementById("strada");

        // Estrae le strade uniche, le formatta belle e le ordina alfabeticamente
        const stradeUniche = [
          ...new Set(masterRoute[zona].map((b) => b.street)),
        ];
        stradeUniche.sort((a, b) => a.localeCompare(b));

        selectStrada.innerHTML = "";
        stradeUniche.forEach((strada) => {
          selectStrada.innerHTML += `<option value="${strada.toUpperCase()}">${strada}</option>`;
        });
      }

      function aggiungiPacco() {
        const zona = document.getElementById("zona").value;
        const strada = document.getElementById("strada").value; // Già uppercase dal select
        const civico = document
          .getElementById("civico")
          .value.trim()
          .toUpperCase();
        const pezzi = parseInt(document.getElementById("pezzi").value);

        if (!civico) return mostraAlert("Devi inserire un numero civico.");
        if (isNaN(pezzi) || pezzi < 1) return mostraAlert("Pezzi non validi.");

        // Controlla se esiste già questa consegna esatta per la ZONA CORRENTE
        const indiceEsistente = consegne.findIndex(
          (c) => c.zona === zona && c.strada === strada && c.civico === civico,
        );

        if (indiceEsistente !== -1) {
          consegne[indiceEsistente].pezzi += pezzi;
        } else {
          // Calcolo Ordinamento e controllo Fuori Rotta
          const foundMaster = routeFlat[zona].find(
            (item) => item.strada === strada && item.civico === civico,
          );

          let ordineId = 0;
          let fuoriRotta = false;

          if (foundMaster) {
            ordineId = foundMaster.ordineId;
          } else {
            fuoriRotta = true;
            // Mettiamo il civico sconosciuto in fondo al blocco della sua strada
            ordineId = (routeMaxIndex[zona][strada] || 999000) + 1;
            // Aggiungiamo un decimale basato sul tempo per non sovrapporre più civici sconosciuti
            ordineId += (Date.now() % 1000) / 1000;
          }

          consegne.push({
            id: Date.now(),
            zona: zona, // Salviamo l'etichetta della zona per separare le liste
            strada: strada,
            civico: civico,
            pezzi: pezzi,
            ordineId: ordineId,
            fuoriRotta: fuoriRotta,
          });
        }

        document.getElementById("civico").value = "";
        document.getElementById("pezzi").value = "1";
        document.getElementById("civico").focus();

        salvaDatiLocali();
        renderLista();
      }

      function renderLista() {
        const container = document.getElementById("lista-consegne");
        const contatoreUI = document.getElementById("contatore-totale");
        const zonaAttuale = document.getElementById("zona").value;

        // Filtra solo le consegne della zona selezionata
        const consegneZona = consegne.filter((c) => c.zona === zonaAttuale);

        if (consegneZona.length === 0) {
          container.innerHTML =
            '<div class="text-center text-slate-400 py-8 text-sm italic">Nessun pacco inserito.<br>Inizia ad aggiungere civici!</div>';
          contatoreUI.innerText = "0 pacchi totali";
          return;
        }

        container.innerHTML = "";
        let totalePacchi = 0;

        // Ordiniamo la lista basandoci sull'indice del giro impostato
        consegneZona.sort((a, b) => a.ordineId - b.ordineId);

        consegneZona.forEach((c) => {
          totalePacchi += c.pezzi;

          // Stili differenti se è fuori rotta (rosso)
          const bgClass = c.fuoriRotta
            ? "bg-red-50 border-red-200"
            : "bg-white border-slate-100";
          const textStrada = c.fuoriRotta ? "text-red-500" : "text-blue-600";
          const textCivico = c.fuoriRotta ? "text-red-700" : "text-slate-800";
          const warningBadge = c.fuoriRotta
            ? `<span class="text-[10px] bg-red-600 text-white px-2 py-0.5 rounded-full font-bold uppercase tracking-wider ml-2">Fuori Lista</span>`
            : "";

          container.innerHTML += `
                    <div class="${bgClass} p-4 rounded-xl shadow-sm border flex justify-between items-center transform transition active:scale-[0.98]">
                        <div class="flex flex-col">
                            <span class="text-xs font-bold ${textStrada} mb-0.5">${c.strada}</span>
                            <div class="flex items-center">
                                <span class="text-xl font-black ${textCivico}">Civ. ${c.civico}</span>
                                ${warningBadge}
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="bg-white/50 px-3 py-1.5 rounded-lg flex items-center gap-1.5 border border-slate-200">
                                <span class="text-lg">📦</span>
                                <span class="font-extrabold text-lg text-slate-700">${c.pezzi}</span>
                            </div>
                            <button onclick="rimuoviPacco(${c.id})" class="text-slate-300 hover:text-red-600 p-2 rounded-full hover:bg-white transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
        });

        contatoreUI.innerText = `${totalePacchi} pacchi`;
      }

      function generaImmagineWatch() {
        const zonaAttuale = document.getElementById("zona").value;
        const consegneZona = consegne.filter((c) => c.zona === zonaAttuale);

        if (consegneZona.length === 0)
          return mostraAlert("Lista vuota per questa zona!");

        const scale = 2;
        const width = 400 * scale;
        const marginX = 20 * scale;
        const lineHeightHeader = 40 * scale;
        const lineHeightData = 35 * scale;
        const wrapWidth = width - marginX * 2;

        // 1. Raggruppa i blocchi di consegne in base al giro (già ordinato)
        const sortedConsegne = [...consegneZona].sort(
          (a, b) => a.ordineId - b.ordineId,
        );
        const canvasBlocks = [];
        let currentBlock = null;

        sortedConsegne.forEach((c) => {
          if (!currentBlock || currentBlock.strada !== c.strada) {
            if (currentBlock) canvasBlocks.push(currentBlock);
            currentBlock = { strada: c.strada, items: [] };
          }
          currentBlock.items.push(c);
        });
        if (currentBlock) canvasBlocks.push(currentBlock);

        // 2. Simuliamo il disegno per calcolare l'altezza esatta
        const ctxDummy = document.createElement("canvas").getContext("2d");
        ctxDummy.font = `bold ${32 * scale}px -apple-system, system-ui, sans-serif`;

        let simY = 60 * scale + lineHeightHeader + 20 * scale;

        for (const block of canvasBlocks) {
          simY += lineHeightData; // Spazio per il nome Strada

          let cursorX = marginX;
          for (let i = 0; i < block.items.length; i++) {
            const item = block.items[i];
            let text = item.civico + (item.pezzi > 1 ? `(${item.pezzi})` : "");
            let testText = text + (i < block.items.length - 1 ? ", " : "");

            let metrics = ctxDummy.measureText(testText);
            if (
              cursorX + metrics.width > marginX + wrapWidth &&
              cursorX > marginX
            ) {
              cursorX = marginX;
              simY += lineHeightData; // a capo
            }
            cursorX += metrics.width;
          }
          simY += lineHeightData + 15 * scale; // Fine blocco
        }

        const height = Math.max(500 * scale, simY);

        // 3. Creazione del Canvas Definitivo
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = width;
        canvas.height = height;

        // Sfondo
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, width, height);

        // Intestazione
        let y = 60 * scale;
        const oggi = new Date();
        const dataStr = oggi.toLocaleDateString("it-IT", {
          day: "2-digit",
          month: "short",
        });

        ctx.fillStyle = "#3b82f6";
        ctx.font = `bold ${30 * scale}px -apple-system, system-ui, sans-serif`;
        ctx.fillText(
          `${document.getElementById("zona").value.toUpperCase()} - ${dataStr.toUpperCase()}`,
          marginX,
          y,
        );
        y += lineHeightHeader + 15 * scale;

        // Disegno i dati
        for (const block of canvasBlocks) {
          // Nome Strada
          ctx.fillStyle = "#4ade80";
          ctx.font = `bold ${28 * scale}px -apple-system, system-ui, sans-serif`;
          ctx.fillText(block.strada.toUpperCase(), marginX, y);
          y += lineHeightData;

          ctx.font = `bold ${32 * scale}px -apple-system, system-ui, sans-serif`;

          let cursorX = marginX;
          for (let i = 0; i < block.items.length; i++) {
            const item = block.items[i];
            let text = item.civico + (item.pezzi > 1 ? `(${item.pezzi})` : "");
            let isLast = i === block.items.length - 1;
            let textToDraw = text + (isLast ? "" : ", ");

            // Colore rosso acceso se fuori rotta, altrimenti bianco
            ctx.fillStyle = item.fuoriRotta ? "#ef4444" : "#ffffff";

            let metrics = ctx.measureText(textToDraw);
            if (
              cursorX + metrics.width > marginX + wrapWidth &&
              cursorX > marginX
            ) {
              cursorX = marginX;
              y += lineHeightData; // vai a capo
            }

            ctx.fillText(textToDraw, cursorX, y);
            cursorX += metrics.width;
          }
          y += lineHeightData + 15 * scale;
        }

        document.getElementById("watchResultImg").src = canvas.toDataURL(
          "image/jpeg",
          0.9,
        );

        document.getElementById("watchModal").classList.remove("hidden");
        setTimeout(
          () =>
            document.getElementById("watchModal").classList.remove("opacity-0"),
          10,
        );
      }

      function rimuoviPacco(id) {
        consegne = consegne.filter((c) => c.id !== id);
        salvaDatiLocali();
        renderLista();
      }

      function pulisciLista() {
        chiudiMenu();
        setTimeout(() => {
          const btn = document.querySelector("#alertBox button");
          const oldOnclick = btn.onclick;

          document.getElementById("alertMessage").innerText =
            "Vuoi azzerare tutte le consegne di oggi per QUESTA ZONA?";
          btn.innerText = "Sì, CANCELLA TUTTO";
          btn.className =
            "w-full bg-red-600 text-white font-bold py-3 rounded-xl mb-2";

          const cancelBtn = document.createElement("button");
          cancelBtn.innerText = "Annulla";
          cancelBtn.className =
            "w-full bg-slate-200 text-slate-800 font-bold py-3 rounded-xl";
          cancelBtn.id = "tempCancelBtn";
          cancelBtn.onclick = () => resetAlertModal(oldOnclick);

          document.getElementById("alertBox").appendChild(cancelBtn);

          btn.onclick = () => {
            const zonaAttuale = document.getElementById("zona").value;
            // Mantiene intatti i pacchi delle altre zone, rimuove solo l'attuale
            consegne = consegne.filter((c) => c.zona !== zonaAttuale);
            salvaDatiLocali();
            renderLista();
            resetAlertModal(oldOnclick);
          };

          document.getElementById("alertModal").classList.remove("hidden");
          setTimeout(() => {
            document.getElementById("alertModal").classList.remove("opacity-0");
            document.getElementById("alertBox").classList.remove("scale-95");
          }, 10);
        }, 300);
      }

      function salvaDatiLocali() {
        localStorage.setItem("consegneData2", JSON.stringify(consegne));
      }

      function caricaDatiLocali() {
        const dati = localStorage.getItem("consegneData2");
        if (dati) {
          consegne = JSON.parse(dati);
          // Previene che i vecchi dati spariscano assegnandoli a Zona A di default
          consegne.forEach((c) => {
            if (!c.zona) c.zona = "Zona A";
          });
        }
      }

      function mostraAlert(msg) {
        document.getElementById("alertMessage").innerText = msg;
        document.getElementById("alertModal").classList.remove("hidden");
        setTimeout(() => {
          document.getElementById("alertModal").classList.remove("opacity-0");
          document.getElementById("alertBox").classList.remove("scale-95");
        }, 10);
      }

      function chiudiAlert() {
        document.getElementById("alertModal").classList.add("opacity-0");
        document.getElementById("alertBox").classList.add("scale-95");
        setTimeout(
          () => document.getElementById("alertModal").classList.add("hidden"),
          300,
        );
      }

      function chiudiWatchModal() {
        document.getElementById("watchModal").classList.add("opacity-0");
        setTimeout(
          () => document.getElementById("watchModal").classList.add("hidden"),
          300,
        );
      }

      function resetAlertModal(oldOnclick) {
        chiudiAlert();
        setTimeout(() => {
          const btn = document.querySelector("#alertBox button");
          btn.innerText = "Ho capito";
          btn.className =
            "w-full bg-slate-900 text-white font-bold py-3 rounded-xl";
          btn.onclick = oldOnclick;
          const tempBtn = document.getElementById("tempCancelBtn");
          if (tempBtn) tempBtn.remove();
        }, 300);
      }
